name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same command a session runs (T46). If CI ran the five scripts on its own toolchain
      # instead, the two would drift apart on the day the lockfile moved, and neither would be
      # the thing we ship.
      - run: docker compose -f docker-compose.checks.yml run --build --rm checks

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t receipt-scanner:ci .
